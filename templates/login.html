{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <label>Usuario</label>
        <input name="username" required>
        <label>Contraseña</label>
        <input name="password" type="password" required>
        <button type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
